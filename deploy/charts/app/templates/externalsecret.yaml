# DATABASE_URL is assembled in-cluster from the RDS-managed secret, so the password
# is never written to Terraform state or git.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.database.region }}
      # no auth block: uses the controller's IRSA role (app-prod-external-secrets), which can
      # read only the RDS master secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: database
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: {{ printf "postgresql://{{ .username }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" (required "database.host is required" .Values.database.host) .Values.database.port .Values.database.name | quote }}
  dataFrom:
    - extract:
        key: {{ required "database.secretArn is required" .Values.database.secretArn }}
