apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, tier: frontend }
spec:
  replicas: {{ .Values.replicas }}
  # never remove a pod before its replacement is Ready (and registered healthy in the ALB)
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  minReadySeconds: 5
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: frontend }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: frontend }
      containers:
        - name: nginx
          image: {{ .Values.registry }}/frontend@{{ required "frontend.digest is required" .Values.frontend.digest }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # nginx's resolver ignores search domains, so backends must be addressed by FQDN
            - { name: BACKEND_SUFFIX, value: ".{{ .Release.Namespace }}.svc.cluster.local" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              # keep serving until the load balancer and Services have dropped this pod, then
              # stop nginx gracefully (SIGTERM alone would cut in-flight requests)
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}; nginx -s quit; sleep 5"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: conf, emptyDir: { sizeLimit: 1Mi } }
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: frontend }
