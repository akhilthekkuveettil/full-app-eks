# Default deny, then open exactly: ALB -> frontend -> backends -> RDS, plus DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: {{ .Values.vpcCidr }} } # ALB ENIs
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: backend }
        # the VPC CNI policy agent sees the Service ClusterIP (before kube-proxy DNAT),
        # so the Service CIDR must be allowed too, on the backend port only
        - ipBlock: { cidr: {{ .Values.serviceCidr }} }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: frontend }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - ipBlock: { cidr: {{ .Values.vpcCidr }} } # RDS
      ports:
        - { protocol: TCP, port: {{ .Values.database.port }} }
