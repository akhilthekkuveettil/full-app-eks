apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/akhilthekkuveettil/full-app-eks.git
    targetRevision: main
    path: deploy/charts/app
    helm:
      valueFiles:
        - ../../envs/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true # ExternalSecret CRDs arrive via the external-secrets app
    managedNamespaceMetadata:
      labels:
        # new pods are only Ready once the ALB reports their target healthy
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
