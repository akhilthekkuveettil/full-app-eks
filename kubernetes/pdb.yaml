# Node drains and upgrades may evict at most one pod of each app at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend1
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: backend1
---
