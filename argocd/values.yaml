# Helm values for Argo CD (chart argo/argo-cd 10.11.6, Argo CD v3.5.6).
#   helm upgrade --install argocd argo/argo-cd --version 10.11.6 -n argocd --create-namespace -f argocd/values.yaml
#
# The ALB terminates HTTPS with the wildcard ACM certificate, so the Argo CD server itself speaks plain HTTP.
# The Ingress joins ALB group "shared": every Ingress with the same group.name is served by ONE load balancer.
# Not used here (no SSO, no notifications, no ApplicationSets). Each one is a pod, and a t3.small node only allows 11 pods,
# so switching them off keeps room for the app and the monitoring stack.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

configs:
  params:
    server.insecure: true
  cm:
    # local account for developers; an admin sets its password once (argocd account update-password)
    accounts.developer: login
  rbac:
    # nobody gets anything by default; the developer account is read-only
    policy.default: ""
    policy.csv: |
      g, developer, role:readonly

server:
  ingress:
    enabled: true
    ingressClassName: alb
    hostname: argocd.aryanconcretespares.in
    annotations:
      alb.ingress.kubernetes.io/group.name: shared
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:065148239770:certificate/b7c41608-bb26-4e4c-aad2-39d15c05f920
      alb.ingress.kubernetes.io/ssl-redirect: '443'
