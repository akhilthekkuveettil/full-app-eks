name: CI

on:
  push:
    branches: [main]
    # A digest-bump PR only edits deploy/; running CI for it would publish a new image,
    # open another bump PR, and loop forever.
    paths-ignore:
      - "deploy/**"
      - "**.md"
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so newly published CVEs are caught without a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend1, backend2, backend3, backend4]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --require-hashes --disable-pip

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npx ng test --no-watch

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Only on pushes to main, after tests and dependency scans pass.
  # Auth is GitHub OIDC -> IAM role limited to this repo's main branch and ECR push.
  publish:
    name: publish ${{ matrix.service }}
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS and keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        service: [backend1, backend2, backend3, backend4, frontend]
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: false

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image (keyless)
        run: |
          image="${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}@${{ steps.push.outputs.digest }}"
          # An unchanged service rebuilds to the same digest, whose signature tag already exists
          # (tags are immutable), so only sign when this workflow has not signed the digest yet.
          if cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image" > /dev/null 2>&1; then
            echo "Already signed by this workflow: $image"
          else
            cosign sign --yes "$image"
          fi

      - name: Summary
        run: |
          echo "${{ matrix.service }}: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # Opens (or updates) one pull request that points deploy/envs/prod.yaml at the images that
  # were just published. Merging it is the production deploy: Argo CD syncs from main.
  bump-digests:
    name: open digest bump PR
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open / update the PR
      id-token: write # OIDC to AWS (read digests) and cosign verification
    env:
      AWS_REGION: us-east-1
      BRANCH: automation/bump-digests
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Resolve and verify digests for this commit
        id: digests
        run: |
          pairs=""
          for svc in backend1 backend2 backend3 backend4 frontend; do
            digest=$(aws ecr describe-images --repository-name "app/$svc" \
              --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' --output text)
            image="${{ steps.ecr.outputs.registry }}/app/$svc@$digest"
            # only images signed by this workflow on main may be deployed
            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" > /dev/null
            echo "$svc  $digest"
            pairs="$pairs $svc=$digest"
          done
          echo "pairs=${pairs# }" >> "$GITHUB_OUTPUT"

      - name: Update deploy/envs/prod.yaml
        run: python3 .github/scripts/bump_digests.py deploy/envs/prod.yaml ${{ steps.digests.outputs.pairs }}

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- deploy/envs/prod.yaml; then
            echo "Digests already current; nothing to deploy."
            exit 0
          fi

          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add deploy/envs/prod.yaml
          git commit -m "deploy: use images built from $short"
          git push --force origin "$BRANCH"

          body="Points production at the images published from \`$short\` (all five signed by this workflow and verified with cosign).

          Merging this PR deploys: Argo CD syncs \`deploy/\` from \`main\`.
          Roll back by reverting the merge commit.

          Source commit: ${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Deploy images from $short" --body "$body"
            echo "Updated PR #$existing"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Deploy images from $short" --body "$body"
          fi
