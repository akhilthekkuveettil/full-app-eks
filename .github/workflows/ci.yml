# CI/CD pipeline. Stages, in order:
#
#   Detect  ->  Test (backends + frontend)  ->  Infra (terraform plan / apply)
#           ->  Release (scan, push, sign images)  ->  Deploy (open the digest-bump PR)
#
# * Pull requests run Detect, Test and (when infra/ changed) the read-only Terraform plan.
# * Pushes to main continue through Release and Deploy.
# * Merging the digest-bump PR is the production deploy; Argo CD syncs deploy/ from main.
#
# Keep this file named ci.yml: image signatures are verified against this workflow's identity.
name: CI

on:
  push:
    branches: [main]
    # The digest-bump PR only edits deploy/. Running CI for it would publish new images and
    # open another bump PR, forever.
    paths-ignore:
      - "deploy/**"
      - "**.md"
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so newly published CVEs are caught without a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────── 1. Detect ───────────────────────────────
  detect-changes:
    name: "Detect · infra changes"
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did anything under infra/ change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          infra=false
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              # a brand-new branch or a force-push has no usable "before": be safe and run
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                infra=true
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *) range="" ;; # scheduled runs only re-test and re-scan the code
          esac
          if [ "$infra" = false ] && [ -n "${range:-}" ]; then
            if git diff --name-only "$range" | grep -q '^infra/'; then infra=true; fi
          fi
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "Terraform will run: $infra"

  # ──────────────────────────────── 2. Test ────────────────────────────────
  test-backend:
    name: "Test · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend1, backend2, backend3, backend4]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests (pytest)
        run: python -m pytest -q

      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --require-hashes --disable-pip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-frontend:
    name: "Test · frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npx ng test --no-watch

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ──────────────────────────────── 3. Infra ───────────────────────────────
  # Only when infra/ changed. Plan runs with a read-only role on PRs and pushes. Apply runs on
  # main only, only when the plan has changes, and only after approval on the
  # "production-infra" environment; it applies exactly the plan that was reviewed.
  terraform-plan:
    name: "Infra · terraform plan"
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: infra/terraform/prod
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform
        with:
          api-allowed-cidrs: ${{ secrets.TF_API_ALLOWED_CIDRS }}

      - name: Format check
        run: terraform fmt -check -recursive -diff ..

      - name: Configure AWS credentials (plan role, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=120s -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo '### Terraform plan'
            if [ "$code" -eq 2 ]; then echo 'Changes detected:'; else echo 'No changes.'; fi
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan for the apply job
        if: steps.plan.outputs.changes == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/prod/tfplan
          retention-days: 1

  terraform-apply:
    name: "Infra · terraform apply (needs approval)"
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.terraform-plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production-infra
    permissions:
      contents: read
      id-token: write # OIDC to AWS
    env:
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: infra/terraform/prod
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform
        with:
          api-allowed-cidrs: ${{ secrets.TF_API_ALLOWED_CIDRS }}

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/prod

      - name: Init
        run: terraform init -input=false

      # a saved plan applies only if state has not changed since it was made
      - name: Apply the reviewed plan
        run: terraform apply -input=false -lock-timeout=120s tfplan

  # ─────────────────────────────── 4. Release ──────────────────────────────
  # Pushes to main only, after tests, dependency scans and the Infra stage. A skipped Terraform
  # job (nothing changed) counts as ready; a failed one blocks the release.
  publish-image:
    name: "Release · publish ${{ matrix.service }}"
    needs: [test-backend, test-frontend, terraform-plan, terraform-apply]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.test-backend.result == 'success'
      && needs.test-frontend.result == 'success'
      && (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
      && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS and keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        service: [backend1, backend2, backend3, backend4, frontend]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (ECR push role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image (keyless)
        run: |
          image="${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}@${{ steps.push.outputs.digest }}"
          # An unchanged service rebuilds to the same digest, whose signature tag already exists
          # (tags are immutable), so only sign when this workflow has not signed the digest yet.
          if cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image" > /dev/null 2>&1; then
            echo "Already signed by this workflow: $image"
          else
            cosign sign --yes "$image"
          fi

      - name: Write image digest to the job summary
        run: |
          echo "${{ matrix.service }}: ${{ steps.ecr.outputs.registry }}/app/${{ matrix.service }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────── 5. Deploy ──────────────────────────────
  # Opens (or updates) one pull request that points deploy/envs/prod.yaml at the images that
  # were just published. Merging it is the production deploy.
  open-deploy-pr:
    name: "Deploy · open digest-bump PR"
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open / update the PR
      id-token: write # OIDC to AWS (read digests) and cosign verification
    env:
      BRANCH: automation/bump-digests
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (ECR push role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426737295553:role/app-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Resolve image digests and verify signatures
        id: digests
        run: |
          pairs=""
          for svc in backend1 backend2 backend3 backend4 frontend; do
            digest=$(aws ecr describe-images --repository-name "app/$svc" \
              --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' --output text)
            image="${{ steps.ecr.outputs.registry }}/app/$svc@$digest"
            # only images signed by this workflow on main may be deployed
            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" > /dev/null
            echo "$svc  $digest"
            pairs="$pairs $svc=$digest"
          done
          echo "pairs=${pairs# }" >> "$GITHUB_OUTPUT"

      - name: Update deploy/envs/prod.yaml
        run: python3 .github/scripts/bump_digests.py deploy/envs/prod.yaml ${{ steps.digests.outputs.pairs }}

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- deploy/envs/prod.yaml; then
            echo "Digests already current; nothing to deploy."
            exit 0
          fi

          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add deploy/envs/prod.yaml
          git commit -m "deploy: use images built from $short"
          git push --force origin "$BRANCH"

          body="Points production at the images published from \`$short\` (all five signed by this workflow and verified with cosign).

          Merging this PR deploys: Argo CD syncs \`deploy/\` from \`main\`.
          Roll back by reverting the merge commit.

          Source commit: ${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Deploy images from $short" --body "$body"
            echo "Updated PR #$existing"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Deploy images from $short" --body "$body"
          fi
