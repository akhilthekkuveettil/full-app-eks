# One pipeline, in order: infrastructure first, then the application.
#   pull request  plan (read-only role) + backend tests
#   push to master  infra apply (after a reviewer approves the "production" environment)
#                   -> build and push images -> write the new tag into kubernetes/kustomization.yaml
#                   -> Argo CD rolls the new images out
# Only the parts whose files changed run; "Run workflow" (workflow_dispatch) runs everything.
# The approval is the GitHub environment "production" (Settings > Environments > required reviewers).
name: deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "065148239770"
  CLUSTER: app-study
  TERRAGRUNT_VERSION: v1.2.1
  ARGOCD_CHART_VERSION: 10.11.6

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          echo "infra=$(echo "$files" | grep -qE '^(terraform/|argocd/|\.github/workflows/deploy\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "app=$(echo "$files" | grep -qE '^(backend[1-4]/|frontend/|\.github/workflows/deploy\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          base=https://github.com/gruntwork-io/terragrunt/releases/download/$TERRAGRUNT_VERSION
          curl -fsSLO "$base/terragrunt_linux_amd64"
          curl -fsSL "$base/SHA256SUMS" | grep ' terragrunt_linux_amd64$' | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/app-github-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan (read-only role, no state lock)
        working-directory: terraform/live/study
        run: terragrunt run --all plan --non-interactive -- -lock=false

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend1, backend2, backend3, backend4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        working-directory: ${{ matrix.service }}
        run: |
          # requirements.txt carries hashes, which switches pip to hash mode for the whole command,
          # so the unhashed dev tools go in a second install
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
          # python -m puts the service folder on sys.path, which "from app import main" needs
          python -m pytest -q

  infra:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          base=https://github.com/gruntwork-io/terragrunt/releases/download/$TERRAGRUNT_VERSION
          curl -fsSLO "$base/terragrunt_linux_amd64"
          curl -fsSL "$base/SHA256SUMS" | grep ' terragrunt_linux_amd64$' | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/app-github-infra
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply infrastructure
        working-directory: terraform/live/study
        run: terragrunt run --all --non-interactive --backend-bootstrap apply

      - name: Connect kubectl
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl -n kube-system rollout status deploy/aws-load-balancer-controller --timeout=300s

      - name: Database secret
        run: |
          DATABASE_URL=$(cd terraform/live/study/rds && terragrunt output -raw database_url)
          echo "::add-mask::$DATABASE_URL"
          kubectl apply -f kubernetes/namespace.yaml
          kubectl create secret generic database -n app --from-literal=DATABASE_URL="$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm upgrade --install argocd argo/argo-cd --version "$ARGOCD_CHART_VERSION" \
            -n argocd --create-namespace -f argocd/values.yaml --wait --timeout 10m
          kubectl apply -f argocd/application.yaml

  build:
    # waits for the infrastructure (the ECR repositories come from it); runs when infra was skipped too
    needs: [changes, test, infra]
    if: >-
      always() && github.event_name != 'pull_request'
      && needs.changes.outputs.app == 'true'
      && needs.test.result == 'success'
      && (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend1, backend2, backend3, backend4, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/app-github-images
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          image=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/app/${{ matrix.service }}:${GITHUB_SHA::7}
          docker build -t "$image" ./${{ matrix.service }}
          docker push "$image"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write the new tag into kustomization.yaml
        run: |
          tag=${GITHUB_SHA::7}
          for s in backend1 backend2 backend3 backend4 frontend; do
            sed -i "/- name: $s\$/,/newTag:/ s/newTag: .*/newTag: $tag/" kubernetes/kustomization.yaml
          done
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "chore: deploy images ${GITHUB_SHA::7}" && git pull --rebase && git push; }
