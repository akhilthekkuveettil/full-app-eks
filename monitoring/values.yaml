# Helm values for kube-prometheus-stack (chart 92.14.1), deployed by argocd/monitoring.yaml.
# Sized for three t3.small nodes: small requests, memory limits, 7 days of metrics on one 10 GiB volume.
# Grafana is served at https://monitoring.aryanconcretespares.in through the shared ALB (group "shared", like the app
# and Argo CD); TLS ends at the ALB with the wildcard ACM certificate. DNS: a CNAME to the ALB hostname at GoDaddy.

# EKS runs these control plane parts outside the cluster, so they cannot be scraped and would only raise false alerts
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # pick up ServiceMonitors and PodMonitors from any namespace, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }

grafana:
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - monitoring.aryanconcretespares.in
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: shared
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:065148239770:certificate/b7c41608-bb26-4e4c-aad2-39d15c05f920
      alb.ingress.kubernetes.io/ssl-redirect: '443'
  grafana.ini:
    server:
      root_url: https://monitoring.aryanconcretespares.in
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  # the Secret "grafana-admin" is created by the infra job; the password is not in git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Grafana 13 needs more than 256Mi: at that limit it was OOM-killed, answered probes slowly and the ALB had no healthy target (503)
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }
