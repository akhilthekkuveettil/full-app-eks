# Helm values for kube-prometheus-stack (chart 92.14.1), deployed by argocd/monitoring.yaml.
# Sized for three t3.small nodes: small requests, memory limits, 7 days of metrics on one 10 GiB volume.
# Grafana is not exposed: kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80

# EKS runs these control plane parts outside the cluster, so they cannot be scraped and would only raise false alerts
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # pick up ServiceMonitors and PodMonitors from any namespace, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }

grafana:
  # the Secret "grafana-admin" is created by the infra job; the password is not in git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }
